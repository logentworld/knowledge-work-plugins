name: 커밋마다 .lpg 빌드

on:
  push:
    branches: [main, logent]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.LOGENT_PLUGIN_API_TOKEN || github.token }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API 잠금 커밋을 확인해요
        id: api-pin
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^commit=//p' plugin-api.lock)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo 'plugin-api.lock의 commit이 올바르지 않아요.' >&2; exit 1; }
          echo "commit=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: logentworld/plugin
          ref: ${{ steps.api-pin.outputs.commit }}
          token: ${{ secrets.LOGENT_PLUGIN_API_TOKEN || github.token }}
          path: api-src
          fetch-depth: 1
      - name: API 체크아웃 커밋을 검증해요
        env:
          API_COMMIT: ${{ steps.api-pin.outputs.commit }}
        run: '[[ "$(git -C api-src rev-parse HEAD)" == "$API_COMMIT" ]]'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Android SDK를 설치해요
        run: |
          sdk_tools="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools"
          if ! sdkmanager="$(find "$sdk_tools" -type f -name sdkmanager -print -quit)"; then
            echo "Android SDK 도구 경로를 읽지 못했어요: $sdk_tools" >&2
            exit 1
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "실행 가능한 sdkmanager를 찾지 못했어요: $sdk_tools" >&2
            exit 1
          fi
          if ! (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null); then
            echo "Android SDK 라이선스를 승인하지 못했어요: $sdkmanager" >&2
            exit 1
          fi
          if ! "$sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'; then
            echo "Android SDK 패키지를 설치하지 못했어요: $sdkmanager" >&2
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: API 계약을 로컬 Maven에 발행해요
        working-directory: api-src
        run: ./gradlew --no-daemon :plugin-api:publishToMavenLocal
      - name: 테스트와 lint를 실행해요
        run: ./logent/test.sh -PlogentPluginApiMavenLocal=true
      - name: 운영 키를 준비해요
        env:
          CONTENT_SIGNING_KEY: ${{ secrets.LOGENT_CONTENT_SIGNING_KEY }}
        run: |
          if [[ -n "$CONTENT_SIGNING_KEY" ]]; then
            umask 077
            key="$RUNNER_TEMP/plugin-signing.pem"
            printf '%s\n' "$CONTENT_SIGNING_KEY" > "$key"
            echo "LOGENT_CONTENT_SIGNING_KEY_FILE=$key" >> "$GITHUB_ENV"
          fi
      - name: AAR·D8·서명 패키지를 빌드해요
        run: ./logent/build.sh -PlogentPluginApiMavenLocal=true
      - name: 실행별 산출물을 보존해요
        uses: actions/upload-artifact@v4
        with:
          name: logent-knowledge-work-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/dist/
      - name: edge 또는 태그 릴리스에 게시해요
        env:
          GH_TOKEN: ${{ github.token }}
          LOGENT_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
        run: ./logent/publish-release.sh '커밋 ${{ github.sha }}의 패키지예요.'
